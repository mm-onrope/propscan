<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoolFinder — Feature Review Tool</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#070b14;--card:#0f1420;--cyan:#06d6a0;--cdim:rgba(6,214,160,.12);--cbrd:rgba(6,214,160,.25);--blue:#118ab2;--red:#ef4444;--orange:#ef8354;--gold:#ffd166;--pool:#4fc3f7;--t1:#e8ecf4;--t2:#8a94a8;--t3:#5a6478;--bdr:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:44px;background:rgba(7,11,20,.95);border-bottom:1px solid var(--bdr);flex-shrink:0;z-index:300;gap:6px;overflow-x:auto}
.tb-l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;white-space:nowrap}
.logo-i{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn{padding:5px 10px;border-radius:5px;font-size:.75rem;border:none;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-g{background:transparent;border:1px solid var(--bdr);color:var(--t2)}.btn-g:hover{border-color:var(--t3);color:var(--t1)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:#dc2626}.btn-r:disabled{opacity:.4;cursor:not-allowed}
.btn-c{background:var(--cyan);color:var(--bg)}.btn-c:hover{opacity:.9}

/* Main layout */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* Controls panel — overlays the map on desktop, collapses on mobile */
.controls{position:absolute;top:0;left:0;z-index:200;width:300px;max-height:100%;overflow-y:auto;background:rgba(15,20,32,.95);backdrop-filter:blur(12px);border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);border-radius:0 0 12px 0;transition:transform .3s}
.controls.collapsed{transform:translateX(-100%)}
.ctrl-toggle{position:absolute;top:8px;left:8px;z-index:250;padding:6px 10px;border-radius:6px;background:rgba(7,11,20,.9);backdrop-filter:blur(10px);border:1px solid var(--bdr);color:var(--t1);font-size:.8rem;cursor:pointer;font-family:inherit;display:none}

.sb-section{padding:10px 12px;border-bottom:1px solid var(--bdr)}
.sb-section h3{font-size:.72rem;color:var(--cyan);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.sb-section select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--bdr);border-radius:5px;color:var(--t1);font-family:inherit;font-size:.8rem;outline:none;margin-bottom:4px}
.sb-section select:focus{border-color:var(--cbrd)}

.stats-row{display:flex;gap:6px}
.stat-box{flex:1;text-align:center;padding:6px 2px;background:rgba(255,255,255,.02);border-radius:5px}
.stat-box .n{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--cyan)}
.stat-box .l{font-size:.6rem;color:var(--t3)}

.mode-btns{display:flex;gap:4px}
.mode-btn{flex:1;padding:6px;border-radius:5px;font-size:.72rem;border:1px solid var(--bdr);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.mode-btn.active{background:var(--cdim);border-color:var(--cbrd);color:var(--cyan)}
.help-text{font-size:.68rem;color:var(--t3);margin-top:4px;line-height:1.4}

/* Loading */
.loading{display:none;align-items:center;gap:8px;padding:10px 12px;font-size:.82rem;color:var(--cyan)}
.loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--bdr);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Map fills entire area */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%;z-index:1}
.leaflet-container{background:var(--bg)}

/* Box select rectangle */
.select-rect{position:absolute;border:2px dashed var(--red);background:rgba(239,68,68,.12);pointer-events:none;z-index:400;display:none}

/* Action bar */
.action-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(7,11,20,.92);backdrop-filter:blur(12px);border:1px solid var(--bdr);border-radius:10px;padding:8px 14px;display:none;align-items:center;gap:10px;font-size:.82rem}
.action-bar.show{display:flex}
.action-bar .count{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:700}

/* Feature count badge on map */
.map-badge{position:absolute;top:8px;right:8px;z-index:250;background:rgba(7,11,20,.9);backdrop-filter:blur(10px);border:1px solid var(--bdr);border-radius:8px;padding:6px 12px;font-size:.78rem;color:var(--t2)}
.map-badge strong{color:var(--cyan);font-family:'JetBrains Mono',monospace}

/* Toast */
.toast{position:fixed;top:50px;right:16px;z-index:2000;background:var(--card);border:1px solid var(--cbrd);border-radius:8px;padding:10px 16px;font-size:.82rem;color:var(--cyan);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Mobile */
@media(max-width:768px){
  .controls{width:100%;max-height:50vh;border-radius:0 0 12px 12px;border-right:none}
  .controls.collapsed{transform:translateY(-100%)}
  .ctrl-toggle{display:block}
  .topbar{height:40px}
  .tb-l{font-size:.78rem}
  .btn{font-size:.7rem;padding:4px 8px}
}
</style>
</head><body>

<div class="topbar">
<div class="tb-l"><div class="logo-i">🏊</div> Review Tool</div>
<div class="tb-r">
<button class="btn btn-g" onclick="selectAllVisible()">Select All Visible</button>
<button class="btn btn-g" onclick="deselectAll()">Clear</button>
<button class="btn btn-r" id="deleteBtn" disabled onclick="deleteSelected()">🗑 Delete (0)</button>
<button class="btn btn-g" onclick="location.href='/admin'">← Admin</button>
</div>
</div>

<div class="main">
<button class="ctrl-toggle" id="ctrlToggle" onclick="toggleControls()">☰ Controls</button>

<div class="controls" id="controls">
<div class="sb-section">
<h3>📍 Load Region</h3>
<select id="regionSelect" onchange="loadRegion()">
<option value="">Select region...</option>
<option value="__ALL__">🌏 ALL REGIONS (global view)</option>
</select>
</div>
<div class="sb-section">
<div class="stats-row">
<div class="stat-box"><div class="n" id="statTotal">—</div><div class="l">Loaded</div></div>
<div class="stat-box"><div class="n" id="statSelected">0</div><div class="l">Selected</div></div>
<div class="stat-box"><div class="n" id="statRes">—</div><div class="l">Res.</div></div>
<div class="stat-box"><div class="n" id="statOther">—</div><div class="l">Other</div></div>
</div>
</div>
<div class="sb-section">
<h3>🖱 Selection Mode</h3>
<div class="mode-btns">
<button class="mode-btn active" data-mode="click" onclick="setMode('click')">🖱 Click</button>
<button class="mode-btn" data-mode="box" onclick="setMode('box')">▢ Box Select</button>
</div>
<div class="help-text">
<b>Click:</b> Tap markers to toggle selection.<br>
<b>Box:</b> Drag rectangle to select all inside it.
</div>
</div>
<div class="sb-section">
<h3>🔍 Filter</h3>
<select id="filterConf" onchange="applyFilter()">
<option value="0">All confidence levels</option>
<option value="50">Below 50% (likely false positives)</option>
<option value="60">Below 60%</option>
<option value="70">Below 70%</option>
<option value="80">Below 80%</option>
<option value="90">Below 90%</option>
</select>
<select id="filterType" onchange="applyFilter()">
<option value="">All property types</option>
<option value="Residential">Residential only</option>
<option value="Strata">Strata only</option>
<option value="Commercial">Commercial only</option>
</select>
</div>
<div class="loading" id="loadingEl"><div class="spinner"></div> <span id="loadingMsg">Loading features...</span></div>
</div>

<div class="map-wrap">
<div id="map"></div>
<div class="select-rect" id="selectRect"></div>
<div class="map-badge" id="mapBadge" style="display:none"><strong id="badgeCount">0</strong> on map · <strong id="badgeSel" style="color:var(--red)">0</strong> selected</div>
<div class="action-bar" id="actionBar">
<span><span class="count" id="actionCount">0</span> selected for deletion</span>
<button class="btn btn-r" onclick="deleteSelected()">🗑 Delete</button>
<button class="btn btn-g" onclick="deselectAll()">Cancel</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let map, features = [], markerLayer = null, selected = new Set(), mode = 'click';
let isDrawing = false, rectStartX, rectStartY;
let controlsOpen = true;

// ── Map ──
map = L.map('map', {zoomControl: false}).setView([-33.8, 151.0], 10);
L.control.zoom({position: 'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri', maxZoom: 20
}).addTo(map);

// Marker layer group for performance
markerLayer = L.layerGroup().addTo(map);

// ── Controls toggle (mobile) ──
function toggleControls() {
    controlsOpen = !controlsOpen;
    document.getElementById('controls').classList.toggle('collapsed', !controlsOpen);
    document.getElementById('ctrlToggle').textContent = controlsOpen ? '✕ Hide' : '☰ Controls';
}

// ── Init — load regions ──
async function init() {
    try {
        const r = await fetch(API + '/admin/data', {credentials: 'include'});
        if (!r.ok) { location.href = '/admin'; return; }
        const d = await r.json();
        const sel = document.getElementById('regionSelect');
        (d.regions_scanned || []).forEach(rg => {
            const opt = document.createElement('option');
            opt.value = JSON.stringify(rg);
            opt.textContent = `${rg.suburb}, ${rg.state} — ${rg.count} features (avg ${rg.avg_conf}%)`;
            sel.appendChild(opt);
        });
    } catch (e) { toast('Failed to load: ' + e.message); }
}

// ── Load features ──
async function loadRegion() {
    const val = document.getElementById('regionSelect').value;
    if (!val) return;

    showLoading('Loading features...');
    selected.clear();

    try {
        let url;
        if (val === '__ALL__') {
            url = `${API}/admin/features?limit=10000`;
        } else {
            const rg = JSON.parse(val);
            const params = new URLSearchParams();
            if (rg.suburb) params.set('suburb', rg.suburb);
            if (rg.state) params.set('state', rg.state);
            if (rg.postcode) params.set('postcode', rg.postcode);
            params.set('limit', '10000');
            url = `${API}/admin/features?${params}`;
        }

        const r = await fetch(url, {credentials: 'include'});
        if (!r.ok) { toast('Failed: ' + r.status); hideLoading(); return; }
        const d = await r.json();
        features = d.features || [];

        if (features.length === 0) {
            toast('No features found');
            hideLoading();
            return;
        }

        showLoading(`Rendering ${features.length} markers...`);
        // Short delay so the UI can update
        await new Promise(r => setTimeout(r, 50));

        renderFeatures();

        // Fit map to features
        const validPts = features.filter(f => f.lat && f.lng);
        if (validPts.length) {
            const bounds = L.latLngBounds(validPts.map(f => [f.lat, f.lng]));
            map.fitBounds(bounds, {padding: [30, 30]});
        }

        toast(`Loaded ${features.length} features`);

        // Collapse controls on mobile after loading
        if (window.innerWidth < 768) {
            controlsOpen = false;
            document.getElementById('controls').classList.add('collapsed');
            document.getElementById('ctrlToggle').textContent = '☰ Controls';
        }
    } catch (e) { toast('Error: ' + e.message); }

    hideLoading();
}

function showLoading(msg) {
    const el = document.getElementById('loadingEl');
    document.getElementById('loadingMsg').textContent = msg;
    el.classList.add('show');
}
function hideLoading() { document.getElementById('loadingEl').classList.remove('show'); }

// ── Render ──
function renderFeatures() {
    markerLayer.clearLayers();
    const filter = getFilter();

    let shown = 0, res = 0, other = 0;

    features.forEach(f => {
        if (!matchFilter(f, filter)) return;
        if (!f.lat || !f.lng) return;
        shown++;
        if (f.property_type === 'Residential') res++; else other++;

        const conf = f.confidence || 0;
        const isSel = selected.has(f.id);

        // Color by state: selected=red, high conf=green, medium=gold, low=orange
        const fillColor = isSel ? '#ef4444' : conf >= 85 ? '#06d6a0' : conf >= 65 ? '#ffd166' : '#ef8354';
        const borderColor = isSel ? '#ef4444' : '#ffffff';
        const weight = isSel ? 3 : 1;

        const marker = L.circleMarker([f.lat, f.lng], {
            radius: isSel ? 8 : 5,
            fillColor, color: borderColor,
            weight, fillOpacity: 0.85,
            _featureId: f.id  // stash ID for box select
        });

        // Popup with real data only (no fake addresses)
        const dims = (f.length_m && f.width_m) ? `${f.length_m}m × ${f.width_m}m` : '—';
        const area = f.area_m2 ? `${f.area_m2}m²` : '—';
        const addr = f.address || '';
        const suburb = [f.suburb, f.state, f.postcode].filter(Boolean).join(' ');

        marker.bindPopup(`<div style="font:13px 'DM Sans',sans-serif;min-width:160px">
            ${addr ? '<b>' + addr + '</b><br>' : ''}
            <span style="color:#888">${suburb}</span><br>
            📐 ${dims} · ${area}<br>
            ${f.property_type || '—'} · <b>${conf}%</b> conf<br>
            <code style="font-size:10px;color:#999">${f.id}</code>
        </div>`, {closeButton: true});

        marker.on('click', () => {
            if (mode === 'click') {
                toggleSelect(f.id);
            }
        });

        markerLayer.addLayer(marker);
    });

    // Update stats
    document.getElementById('statTotal').textContent = shown;
    document.getElementById('statSelected').textContent = selected.size;
    document.getElementById('statRes').textContent = res;
    document.getElementById('statOther').textContent = other;

    // Map badge
    const badge = document.getElementById('mapBadge');
    badge.style.display = 'block';
    document.getElementById('badgeCount').textContent = shown;
    document.getElementById('badgeSel').textContent = selected.size;

    updateActionBar();
}

function toggleSelect(id) {
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    renderFeatures();
}

function selectAllVisible() {
    const filter = getFilter();
    features.forEach(f => { if (matchFilter(f, filter) && f.lat && f.lng) selected.add(f.id); });
    renderFeatures();
    toast(`Selected ${selected.size} features`);
}

function deselectAll() {
    selected.clear();
    renderFeatures();
}

function getFilter() {
    return {
        maxConf: parseInt(document.getElementById('filterConf').value) || 0,
        type: document.getElementById('filterType').value
    };
}

function matchFilter(f, filter) {
    if (filter.maxConf > 0 && (f.confidence || 0) >= filter.maxConf) return false;
    if (filter.type && f.property_type !== filter.type) return false;
    return true;
}

function applyFilter() { renderFeatures(); }

function updateActionBar() {
    const bar = document.getElementById('actionBar');
    const btn = document.getElementById('deleteBtn');
    if (selected.size > 0) {
        bar.classList.add('show');
        document.getElementById('actionCount').textContent = selected.size;
        btn.disabled = false;
        btn.textContent = `🗑 Delete (${selected.size})`;
    } else {
        bar.classList.remove('show');
        btn.disabled = true;
        btn.textContent = '🗑 Delete (0)';
    }
}

// ── Delete ──
async function deleteSelected() {
    if (selected.size === 0) return;
    const count = selected.size;
    if (!confirm(`Permanently delete ${count} features? This cannot be undone.`)) return;

    const ids = Array.from(selected);
    showLoading(`Deleting ${count} features...`);

    try {
        // Batch in chunks of 500
        for (let i = 0; i < ids.length; i += 500) {
            const chunk = ids.slice(i, i + 500);
            const r = await fetch(API + '/admin/features/bulk-delete', {
                method: 'POST', credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ids: chunk})
            });
            if (!r.ok) { toast('Delete failed at chunk ' + i); break; }
        }

        features = features.filter(f => !selected.has(f.id));
        selected.clear();
        renderFeatures();
        toast(`Deleted ${count} false positives`);
    } catch (e) { toast('Error: ' + e.message); }

    hideLoading();
}

// ── Selection modes ──
function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    if (m === 'box') {
        map.dragging.disable();
        map.getContainer().style.cursor = 'crosshair';
    } else {
        map.dragging.enable();
        map.getContainer().style.cursor = '';
    }
}

// Box select
const mapEl = document.getElementById('map');
const rectEl = document.getElementById('selectRect');

mapEl.addEventListener('mousedown', e => {
    if (mode !== 'box') return;
    isDrawing = true;
    const rect = mapEl.getBoundingClientRect();
    rectStartX = e.clientX - rect.left;
    rectStartY = e.clientY - rect.top;
    rectEl.style.left = rectStartX + 'px';
    rectEl.style.top = rectStartY + 'px';
    rectEl.style.width = '0'; rectEl.style.height = '0';
    rectEl.style.display = 'block';
});

mapEl.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    const rect = mapEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    rectEl.style.left = Math.min(x, rectStartX) + 'px';
    rectEl.style.top = Math.min(y, rectStartY) + 'px';
    rectEl.style.width = Math.abs(x - rectStartX) + 'px';
    rectEl.style.height = Math.abs(y - rectStartY) + 'px';
});

mapEl.addEventListener('mouseup', e => {
    if (!isDrawing) return;
    isDrawing = false;
    rectEl.style.display = 'none';

    const mapRect = mapEl.getBoundingClientRect();
    const x1 = Math.min(rectStartX, e.clientX - mapRect.left);
    const y1 = Math.min(rectStartY, e.clientY - mapRect.top);
    const x2 = Math.max(rectStartX, e.clientX - mapRect.left);
    const y2 = Math.max(rectStartY, e.clientY - mapRect.top);

    // Ignore tiny rectangles (accidental clicks)
    if (Math.abs(x2 - x1) < 15 || Math.abs(y2 - y1) < 15) return;

    const nw = map.containerPointToLatLng([x1, y1]);
    const se = map.containerPointToLatLng([x2, y2]);
    const bounds = L.latLngBounds(nw, se);

    let added = 0;
    const filter = getFilter();
    features.forEach(f => {
        if (!f.lat || !f.lng) return;
        if (!matchFilter(f, filter)) return;
        if (bounds.contains([f.lat, f.lng])) {
            selected.add(f.id);
            added++;
        }
    });

    renderFeatures();
    if (added > 0) toast(`Box selected ${added} features`);
});

// ── Touch support for box select ──
mapEl.addEventListener('touchstart', e => {
    if (mode !== 'box' || e.touches.length !== 1) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = mapEl.getBoundingClientRect();
    isDrawing = true;
    rectStartX = touch.clientX - rect.left;
    rectStartY = touch.clientY - rect.top;
    rectEl.style.left = rectStartX + 'px';
    rectEl.style.top = rectStartY + 'px';
    rectEl.style.width = '0'; rectEl.style.height = '0';
    rectEl.style.display = 'block';
}, {passive: false});

mapEl.addEventListener('touchmove', e => {
    if (!isDrawing) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = mapEl.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    rectEl.style.left = Math.min(x, rectStartX) + 'px';
    rectEl.style.top = Math.min(y, rectStartY) + 'px';
    rectEl.style.width = Math.abs(x - rectStartX) + 'px';
    rectEl.style.height = Math.abs(y - rectStartY) + 'px';
}, {passive: false});

mapEl.addEventListener('touchend', e => {
    if (!isDrawing) return;
    isDrawing = false;
    rectEl.style.display = 'none';
    // Use last known position from the rect element
    const rLeft = parseInt(rectEl.style.left);
    const rTop = parseInt(rectEl.style.top);
    const rW = parseInt(rectEl.style.width);
    const rH = parseInt(rectEl.style.height);
    if (rW < 15 || rH < 15) return;

    const nw = map.containerPointToLatLng([rLeft, rTop]);
    const se = map.containerPointToLatLng([rLeft + rW, rTop + rH]);
    const bounds = L.latLngBounds(nw, se);

    let added = 0;
    const filter = getFilter();
    features.forEach(f => {
        if (!f.lat || !f.lng) return;
        if (!matchFilter(f, filter)) return;
        if (bounds.contains([f.lat, f.lng])) { selected.add(f.id); added++; }
    });
    renderFeatures();
    if (added > 0) toast(`Box selected ${added} features`);
});

// ── Toast ──
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
</body></html>
