<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PropScan — Property Feature Analysis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#070b14;--card:#0f1629;--bdr:rgba(255,255,255,.06);--cyan:#06d6a0;--blue:#4fc3f7;--gold:#ffd166;--orange:#ef8354;--txt:#e8ecf4;--dim:#5a6478;--mid:#8a94a8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh;height:100dvh}
#app{display:flex;height:100%}
@media(max-width:768px){#app{flex-direction:column-reverse}#sidebar{width:100%!important;max-height:48vh;border-right:none!important;border-top:1px solid var(--bdr)}#mw{flex:1;min-height:52vh}}
#sidebar{width:370px;background:#0a0e1a;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#mw{flex:1;position:relative}#map{width:100%;height:100%}
.logo{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.li{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),#118ab2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo h1{font-size:1.05rem;font-weight:600;line-height:1.1}.logo small{font-size:.56rem;color:var(--dim);letter-spacing:.1em}
.srch{padding:10px;border-bottom:1px solid var(--bdr)}
.srch input{width:100%;padding:9px 12px;background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:7px;color:var(--txt);font-size:.85rem;outline:none}
.srch input:focus{border-color:rgba(6,214,160,.4)}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#panel::-webkit-scrollbar{width:5px}#panel::-webkit-scrollbar-thumb{background:#2a3348;border-radius:3px}
.cnt{padding:8px 12px;font-size:.72rem;color:var(--dim);display:flex;justify-content:space-between}
.ri{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .12s}
.ri:hover,.ri:active{background:rgba(6,214,160,.04)}
.ri .nm{font-size:.86rem;font-weight:500}.ri .mt{font-size:.7rem;color:var(--dim);margin-top:1px}
.ri .es{font-family:monospace;font-size:.8rem;color:var(--blue);font-weight:600}
.fi{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .12s}
.fi:hover{background:rgba(6,214,160,.04)}.fi.sel{background:rgba(6,214,160,.06);border-left:2px solid var(--cyan)}.fi.lk{opacity:.38;cursor:default}
.fa{font-size:.82rem;font-weight:500}
.fd{font-size:.7rem;color:var(--mid);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.bg{font-size:.62rem;padding:1px 5px;border-radius:3px;font-weight:500}
.bg-r{background:rgba(79,195,247,.12);color:var(--blue)}.bg-s{background:rgba(255,209,102,.12);color:var(--gold)}.bg-c{background:rgba(239,131,84,.12);color:var(--orange)}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px;border-bottom:1px solid var(--bdr)}
.st{text-align:center;padding:5px 2px;background:rgba(255,255,255,.02);border-radius:5px}
.st .n{font-family:monospace;font-size:1rem;font-weight:700}.st .l{font-size:.58rem;color:var(--dim)}
.fb{display:flex;gap:3px;padding:6px 10px;border-bottom:1px solid var(--bdr)}
.ft{padding:3px 8px;border-radius:4px;border:none;cursor:pointer;font-size:.68rem;background:transparent;color:var(--dim);font-family:inherit}.ft.on{background:rgba(6,214,160,.12);color:var(--cyan)}
.hdr{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.hdr h3{font-size:.9rem;font-weight:600}
.bk{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.78rem;font-family:inherit}
.ab{padding:10px;border-top:1px solid var(--bdr);background:var(--card)}
.btn{padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.84rem;border:none;width:100%;font-family:inherit;display:block;text-align:center}
.btn-p{background:linear-gradient(135deg,var(--cyan),#118ab2);color:var(--bg);text-decoration:none}
.btn-s{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--txt);margin-top:6px}
.btn:active{transform:scale(.98)}
.inf{font-size:.68rem;color:var(--dim);text-align:center;margin-top:6px}
.avg{padding:4px 10px;font-size:.7rem;color:var(--mid);border-bottom:1px solid var(--bdr)}
.sov{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;text-align:center;pointer-events:none;background:rgba(7,11,20,.6);padding:30px 40px;border-radius:16px;border:1px solid var(--bdr)}
.spin{width:52px;height:52px;border:3px solid rgba(6,214,160,.2);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pct{font-family:monospace;font-size:1.6rem;font-weight:700;color:var(--cyan);text-shadow:0 0 20px rgba(6,214,160,.5)}
.smsg{color:rgba(255,255,255,.7);font-size:.82rem;margin-top:2px}
.leaflet-popup-content-wrapper{background:#111827!important;color:var(--txt)!important;border-radius:8px!important;box-shadow:0 4px 20px rgba(0,0,0,.5)!important;border:1px solid rgba(255,255,255,.1)!important}
.leaflet-popup-tip{background:#111827!important}
.leaflet-popup-content{margin:10px 12px!important;font-family:inherit!important;font-size:12px!important;line-height:1.5!important}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
  <div class="logo"><div class="li">📡</div><div><h1>PropScan</h1><small>PROPERTY FEATURE ANALYSIS</small></div></div>
  <div class="srch"><input id="q" placeholder="Search region or postcode..."></div>
  <div id="panel"></div>
</div>
<div id="mw">
  <div id="map"></div>
  <div class="sov hidden" id="sov">
    <div class="spin"></div>
    <div class="pct" id="pct">0%</div>
    <div class="smsg" id="smsg">Initializing scan...</div>
  </div>
</div>
</div>
<script>
const API=window.location.origin;
let map,markers=[],allF=[],selF=null,curKey=null,curR=null,filter='all',regions=[];

map=L.map('map',{center:[-33.73,151.0],zoom:11,zoomControl:false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.45}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

async function init(){
  try{const r=await fetch(API+'/api/regions');const d=await r.json();regions=d.regions}catch(e){console.error(e)}
  renderR('')}

function renderR(q){
  q=q.toLowerCase();
  const f=q?regions.filter(s=>s.name.toLowerCase().includes(q)||s.postcode.includes(q)||s.state.toLowerCase().includes(q)):regions;
  document.getElementById('panel').innerHTML=
    `<div class="cnt"><span>${f.length} regions</span><span>Tap to scan</span></div>`+
    f.map(s=>`<div class="ri" onclick="doScan('${s.key}')"><div><div class="nm">🛰️ ${s.name}</div><div class="mt">${s.state} ${s.postcode}</div></div><div class="es">~${s.est}</div></div>`).join('')}

async function doScan(key){
  curKey=key;curR=regions.find(s=>s.key===key);if(!curR)return;
  map.flyTo([curR.lat,curR.lng],17,{duration:1.5});clrM();allF=[];selF=null;filter='all';
  const ov=document.getElementById('sov');ov.classList.remove('hidden');
  let p=0;const iv=setInterval(()=>{
    p+=Math.random()*2+0.7;if(p>95)p=95;
    document.getElementById('pct').textContent=Math.round(p)+'%';
    document.getElementById('smsg').textContent=
      p<20?'Fetching imagery tiles...':p<45?'Running feature detection...':
      p<70?'Analysing dimensions...':p<85?'Cross-referencing records...':'Finalising...';
  },60);
  try{
    const r=await fetch(API+'/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region_key:key})});
    const d=await r.json();clearInterval(iv);
    document.getElementById('pct').textContent='100%';
    document.getElementById('smsg').textContent=`Found ${d.stats.total} features!`;
    await new Promise(r=>setTimeout(r,700));ov.classList.add('hidden');
    allF=d.features||[];showRes(d);
  }catch(e){clearInterval(iv);ov.classList.add('hidden');alert('Scan failed: '+e.message)}}

function showRes(data){
  const s=data.stats||{};
  const avg=allF.length?Math.round(allF.reduce((a,f)=>a+(f.area_m2||0),0)/allF.length):0;
  let h=`<div class="hdr"><h3>${curR.name} <span style="font-weight:400;color:var(--dim);font-size:.74rem">${curR.state} ${curR.postcode}</span></h3><button class="bk" onclick="back()">← Back</button></div>`;
  h+=`<div class="sts">
    <div class="st"><div class="n" style="color:var(--cyan)">${s.total||0}</div><div class="l">Total</div></div>
    <div class="st"><div class="n" style="color:var(--blue)">${s.residential||0}</div><div class="l">Res.</div></div>
    <div class="st"><div class="n" style="color:var(--gold)">${s.strata||0}</div><div class="l">Strata</div></div>
    <div class="st"><div class="n" style="color:var(--orange)">${s.commercial||0}</div><div class="l">Comm.</div></div></div>`;
  h+=`<div class="avg">Avg area: <b style="color:var(--blue)">${avg}m²</b></div>`;
  h+=`<div class="fb" id="fb"></div><div id="fl"></div>`;
  const bought=data.purchased;
  h+=`<div class="ab">${bought
    ?`<a class="btn btn-p" href="${API}/api/export?region_key=${encodeURIComponent(curKey)}" download>📥 Export CSV (${s.total} records)</a><button class="btn btn-s">📬 Direct Outreach</button>`
    :`<button class="btn btn-p" onclick="buy()">🔓 Unlock All ${s.total} Records — $250</button><div class="inf">${Math.min(5,s.total)} free preview · Full data includes DA references</div>`}</div>`;
  document.getElementById('panel').innerHTML=h;renderFB();renderFL();addM()}

function renderFB(){const fb=document.getElementById('fb');if(!fb)return;
  fb.innerHTML=['all','Residential','Strata','Commercial'].map(f=>`<button class="ft ${filter===f?'on':''}" onclick="setFi('${f}')">${f}</button>`).join('')}
function gf(){return filter==='all'?allF:allF.filter(f=>f.property_type===filter)}
function setFi(f){filter=f;renderFB();renderFL();addM()}

function renderFL(){const fl=document.getElementById('fl');if(!fl)return;const fs=gf();
  fl.innerHTML=fs.map(f=>{const lk=f.locked;
    const bc=f.property_type==='Commercial'?'bg-c':f.property_type==='Strata'?'bg-s':'bg-r';
    return`<div class="fi ${lk?'lk':''} ${selF===f.id?'sel':''}" onclick="${lk?'':`sf('${f.id}')`}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="fa">${lk?f.address:f.address}</div><span class="bg ${bc}">${f.property_type}</span></div>
      ${lk?'<div style="font-size:.7rem;color:var(--dim);margin-top:3px">🔒 Unlock to view</div>'
      :`<div class="fd"><span>📐 ${f.length_m}×${f.width_m}m</span><span>📏 ${f.area_m2}m²</span><span>🎯 ${f.confidence}%</span>${f.ref_number?'<span style="color:var(--gold)">📜 Ref</span>':''}</div>`}
    </div>`}).join('')}

function clrM(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function addM(){clrM();gf().forEach(f=>{
  const c=f.property_type==='Commercial'?'#ef8354':f.property_type==='Strata'?'#ffd166':'#4fc3f7';
  const sz=f.locked?7:(selF===f.id?15:10);
  const ic=L.divIcon({className:'',
    html:`<div style="width:${sz}px;height:${sz}px;background:${c};border:2px solid ${selF===f.id?'#fff':'rgba(255,255,255,.6)'};border-radius:${['Oval','Kidney'].includes(f.variant)?'50%':'3px'};box-shadow:0 0 ${selF===f.id?14:7}px ${c}80;opacity:${f.locked?.3:1}"></div>`,
    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
  const m=L.marker([f.lat,f.lng],{icon:ic}).addTo(map);
  if(!f.locked){
    m.bindPopup(`<b>${f.full_address||f.address}</b><br><span style="color:${c}">${f.length_m}×${f.width_m}m = ${f.area_m2}m²</span><br><span style="color:#888">${f.property_type} · ${f.variant||''} · ${f.confidence}%</span>${f.ref_number?`<br><span style="color:#ffd166">📜 ${f.ref_number}</span>`:''}`);
    m.on('click',()=>{selF=f.id;renderFL();addM()})}
  markers.push(m)})}

function sf(id){selF=id;const f=allF.find(x=>x.id===id);if(f)map.flyTo([f.lat,f.lng],18,{duration:.6});renderFL();addM()}

async function buy(){if(!curKey)return;
  try{const r=await fetch(API+'/api/purchase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region_key:curKey,plan:'pro'})});
    const d=await r.json();allF=d.features;
    showRes({stats:{total:d.features.length,residential:d.features.filter(f=>f.property_type==='Residential').length,strata:d.features.filter(f=>f.property_type==='Strata').length,commercial:d.features.filter(f=>f.property_type==='Commercial').length},purchased:true})
  }catch(e){allF.forEach(f=>{f.locked=false});showRes({stats:{total:allF.length,residential:0,strata:0,commercial:0},purchased:true})}}

function back(){curKey=null;curR=null;allF=[];clrM();map.flyTo([-33.73,151.0],11,{duration:1});renderR(document.getElementById('q').value)}
document.getElementById('q').addEventListener('input',e=>{if(!curKey)renderR(e.target.value)});
init();
</script>
</body>
</html>
